name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify web application
        run: |
          npm test
          npm run check
          npm run build
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Pin Android API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          s=p.read_text()
          s=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          s=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
          p.write_text(s)
          PY
          grep -E 'compileSdkVersion|targetSdkVersion' android/variables.gradle
      - name: Build installable APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee CareerLaunch-SA-debug.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CareerLaunch-SA-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            CareerLaunch-SA-debug.apk.sha256
          if-no-files-found: error
