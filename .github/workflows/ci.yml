name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Upload Netlify-ready site
        uses: actions/upload-artifact@v4
        with:
          name: CareerLaunch-SA-Netlify-Dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
