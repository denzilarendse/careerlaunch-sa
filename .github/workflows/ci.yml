name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Verify release identity
        run: |
          test -s dist/release.json
          node -e "const r=require('./dist/release.json'); if(r.build_id!==process.env.GITHUB_SHA) process.exit(1); console.log(r)"

      - name: Upload Netlify-ready site
        uses: actions/upload-artifact@v4
        with:
          name: CareerLaunch-SA-Netlify-Dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
